# Every service is optional: each sits in a profile of its own name, and
# COMPOSE_PROFILES in .env lists the ones that start. The default is Ollama;
# add letta, n8n and system1 as needed. None of them depends on another.

services:

  # ====================================================================================
  # GENAI STACK
  # ====================================================================================

  # ------------------------------------------------------------------------------------
  # Local LLM Runtime (Ollama)
  # ------------------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.35
    container_name: p4n4-ollama
    profiles: [ollama]
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      # No authentication: localhost only by default. n8n and Letta reach it as
      # p4n4-ollama:11434 on p4n4-net, p4n4-api on the host's localhost.
      - "${OLLAMA_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      # Small-host defaults: one model in memory, one request at a time
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # AI Agent Framework with Memory (Letta)
  # ------------------------------------------------------------------------------------
  letta:
    # Pinned: letta/letta:latest is now Letta's Code App Server, a different
    # product. 0.16 is the server p4n4-api's Agent endpoints use (/v1/agents/).
    image: letta/letta:0.16.8
    container_name: p4n4-letta
    profiles: [letta]
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${LETTA_BIND:-127.0.0.1}:8283:8283"
    environment:
      # Require LETTA_SERVER_PASSWORD (as "Authorization: Bearer <password>")
      # on every request; without SECURE the password isn't checked
      SECURE: "true"
      LETTA_SERVER_PASSWORD: ${LETTA_SERVER_PASSWORD:-lettapassword}
      # Empty: use the Postgres bundled in the image
      LETTA_PG_URI: ""
      # Models from this stack's Ollama
      OLLAMA_BASE_URL: http://p4n4-ollama:11434
    volumes:
      # Agents and their memory live in the bundled Postgres
      - letta-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8283/v1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Workflow Automation (n8n)
  # ------------------------------------------------------------------------------------
  n8n:
    # Pinned to the version the starter workflows were tested with
    image: n8nio/n8n:2.41.6
    container_name: p4n4-n8n
    profiles: [n8n]
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-adminpassword}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-32-char-encryption-key}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${N8N_HOST:-localhost}:5678/
      # Schedules and dates in expressions use the project's timezone, not
      # n8n's default of America/New_York
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      # No usage reports or update checks to n8n's servers
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # Shared with IoT stack — must match values in p4n4-iot .env
      INFLUXDB_URL: http://p4n4-influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-p4n4-stack-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-ming}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-raw_telemetry}
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Fast Typed Decisions (System 1, laya): advisory routing, opt-in with the system1
  # profile. Fetch the pinned checkpoint first: docker compose run --rm system1-pull
  # ------------------------------------------------------------------------------------
  system1:
    image: ${SYSTEM1_IMAGE:-ghcr.io/raisga/p4n4-system1:0.1.0}
    container_name: p4n4-system1
    profiles: [system1]
    restart: ${RESTART_POLICY:-unless-stopped}
    # No host port: callers on p4n4-net use http://p4n4-system1:8000
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Empty: the service refuses to start (32+ characters)
      LAYA_API_KEY: ${SYSTEM1_API_KEY:-}
      LAYA_THREADS: ${SYSTEM1_THREADS:-2}
      # A fine-tuned checkpoint lives in a repository p4n4 controls, pinned like the base (S4)
      SYSTEM1_REPO: ${SYSTEM1_REPO:-convaiinnovations/laya}
      SYSTEM1_REVISION: ${SYSTEM1_REVISION:-aa8c91ca088ec597df95a0d1c76b3063cb2ae5e8}
      SYSTEM1_CHECKPOINT: ${SYSTEM1_CHECKPOINT:-multilingual}
      # Site temperatures per laya bucket: a file in config/system1/calibration/; empty: none
      SYSTEM1_CALIBRATION: ${SYSTEM1_CALIBRATION:-}
    volumes:
      - system1-models:/models:ro
      - ./config/system1/questions:/config/questions:ro
      - ./config/system1/calibration:/config/calibration:ro
    healthcheck:
      # The image has neither curl nor wget
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - p4n4-net

  # One-shot download of the pinned checkpoint, checked against the image's hashes. Its
  # own profile keeps `up` from running it; `p4n4 ai system1 pull` does.
  system1-pull:
    image: ${SYSTEM1_IMAGE:-ghcr.io/raisga/p4n4-system1:0.1.0}
    profiles: [system1-pull]
    # The same user as the service: huggingface_hub keeps its offline index owner-only
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HF_HUB_OFFLINE: "0"
      SYSTEM1_REPO: ${SYSTEM1_REPO:-convaiinnovations/laya}
      SYSTEM1_REVISION: ${SYSTEM1_REVISION:-aa8c91ca088ec597df95a0d1c76b3063cb2ae5e8}
      SYSTEM1_CHECKPOINT: ${SYSTEM1_CHECKPOINT:-multilingual}
    command: ["python", "/app/system1_app.py", "pull"]
    volumes:
      - system1-models:/models
    networks:
      - p4n4-net

# ====================================================================================
# NETWORKS
# ====================================================================================
networks:
  p4n4-net:
    external: true
    name: p4n4-net

# ====================================================================================
# VOLUMES
# ====================================================================================
volumes:
  ollama-data:
  letta-pgdata:
  n8n-data:
  system1-models:
