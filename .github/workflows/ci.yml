name: CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config --quiet

      # .env.example isn't YAML: check it by letting Compose load it instead.
      - name: Lint YAML configs
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 120}}}" docker-compose.yml

      - name: Check .env.example loads in Compose
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Check .env.example completeness
        run: python3 scripts/check_env_example.py

      - name: Validate n8n workflow JSON files
        run: |
          for f in config/n8n/workflows/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
            echo "OK: $f"
          done
