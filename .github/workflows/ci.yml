name: CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config --quiet

      # .env.example isn't YAML: check it by letting Compose load it instead.
      - name: Lint YAML configs
        run: |
          pip install yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 120}}}" docker-compose.yml

      - name: Check .env.example loads in Compose
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Check .env.example completeness
        run: python3 scripts/check_env_example.py

      - name: Validate n8n workflow JSON files
        run: |
          for f in config/n8n/workflows/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
            echo "OK: $f"
          done

      # Budgets need the tokenizer, so the System 1 image workflow checks those
      - name: Validate System 1 question sets
        run: |
          for f in config/system1/questions/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
            echo "OK: $f"
          done
          for f in config/system1/questions/*.eval.jsonl; do
            python3 -c 'import json, sys; [json.loads(l) for l in open(sys.argv[1]) if l.strip()]' "$f" \
              || { echo "::error file=$f::invalid JSON line"; exit 1; }
            echo "OK: $f"
          done

      - name: Build runner image
        run: docker compose --profile ei-runner build ei-runner

  # The edge inference runner (runner/) and scripts/check_env_example.py
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The image's requirements, so the tests import what the runner really loads.
      # PyAudio (for the Edge Impulse SDK) compiles against PortAudio's headers.
      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends portaudio19-dev
          pip install -r runner/requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v
